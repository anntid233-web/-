name: Build Android NDK Library

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with ndk-build
        run: |
          # Android NDK уже предустановлен на сервере, просто запускаем ndk-build
          ndk-build

      - name: Upload compiled library (.so)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-libs
          path: libs/**/*.so
          if-no-files-found: error
          
