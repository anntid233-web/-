version: '3.8'

services:
  bot:
    build: .
    container_name: proxy-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./bot.db:/app/bot.db
      - ./bot.log:/app/bot.log
    # For webhook mode, uncomment ports and set WEBHOOK_HOST in .env
    # ports:
    #   - "8080:8080"
    # environment:
    #   - WEBHOOK_HOST=your-domain.com

  # Optional: PostgreSQL for production
